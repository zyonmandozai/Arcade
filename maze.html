<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Maze</title>
    <style>
        body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; }
        canvas { background:#000; border:2px solid #fff; }
    </style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let grid, w, h, px, py, keys;

function reset() {
    w = 10;
    h = 15;
    grid = [];
    for (let y=0;y<h;y++) {
        const row = [];
        for (let x=0;x<w;x++) {
            row.push(Math.random()<0.2?1:0);
        }
        grid.push(row);
    }
    grid[0][0]=0;
    grid[h-1][w-1]=0;
    px = 0;
    py = 0;
    keys = {};
}
window.addEventListener('keydown', e => keys[e.code] = true);

function update() {
    let dx=0,dy=0;
    if (keys['ArrowUp']) dy=-1;
    if (keys['ArrowDown']) dy=1;
    if (keys['ArrowLeft']) dx=-1;
    if (keys['ArrowRight']) dx=1;
    if (dx||dy) {
        const nx = px+dx;
        const ny = py+dy;
        if (nx>=0 && nx<w && ny>=0 && ny<h && grid[ny][nx]===0) {
            px = nx;
            py = ny;
        }
        keys['ArrowUp']=keys['ArrowDown']=keys['ArrowLeft']=keys['ArrowRight']=false;
    }
}

function draw() {
    const cell = 40;
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,400,600);

    for (let y=0;y<h;y++) {
        for (let x=0;x<w;x++) {
            if (grid[y][x]===1) {
                ctx.fillStyle = '#333';
                ctx.fillRect(x*cell,y*cell,cell,cell);
            }
        }
    }

    ctx.fillStyle = '#0f0';
    ctx.fillRect(px*cell+10,py*cell+10,cell-20,cell-20);

    ctx.fillStyle = '#ff0';
    ctx.fillRect((w-1)*cell+10,(h-1)*cell+10,cell-20,cell-20);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
