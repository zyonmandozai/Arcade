<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Warp Tunnel</title>
<style>
body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; }
canvas { background:#000; border:2px solid #fff; }
</style>
</head>
<body>
<canvas id="game" width="500" height="500"></canvas>
<script>
const c = document.getElementById("game");
const x = c.getContext("2d");

let px = 250, py = 400, keys = {};
let obstacles = [], frame = 0, gameOver = false;

window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

function reset() {
    px = 250;
    py = 400;
    obstacles = [];
    frame = 0;
    gameOver = false;
}

function update() {
    if (gameOver) return;

    if (keys["ArrowLeft"]) px -= 5;
    if (keys["ArrowRight"]) px += 5;
    px = Math.max(20, Math.min(480, px));

    frame++;
    if (frame % 20 === 0) {
        const gap = 120;
        const center = Math.random()*300 + 100;
        obstacles.push({y:-40, left:center-gap/2, right:center+gap/2});
    }

    obstacles.forEach(o => o.y += 8);
    obstacles = obstacles.filter(o => o.y < 540);

    for (const o of obstacles) {
        if (o.y > 380 && o.y < 420) {
            if (px < o.left || px > o.right) gameOver = true;
        }
    }
}

function draw() {
    x.fillStyle = "#000";
    x.fillRect(0,0,500,500);

    x.strokeStyle = "#0ff";
    x.lineWidth = 2;
    obstacles.forEach(o => {
        x.beginPath();
        x.moveTo(0,o.y);
        x.lineTo(o.left,o.y);
        x.moveTo(o.right,o.y);
        x.lineTo(500,o.y);
        x.stroke();
    });

    x.fillStyle = "#ff0";
    x.beginPath();
    x.arc(px,py,10,0,Math.PI*2);
    x.fill();

    if (gameOver) {
        x.fillStyle = "#fff";
        x.font = "32px system-ui";
        x.fillText("Warp Failed", 150, 250);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
