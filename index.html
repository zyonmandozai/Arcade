<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zyon Arcade</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 260px;
      background: #0b0b0b;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
    }
    #sidebarHeader {
      padding: 12px 14px;
      border-bottom: 1px solid #222;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    #gameList {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .sectionTitle {
      font-size: 11px;
      text-transform: uppercase;
      opacity: 0.7;
      margin: 8px 4px 4px;
    }
    .gameBtn {
      width: 100%;
      text-align: left;
      padding: 6px 8px;
      margin: 2px 0;
      border-radius: 6px;
      border: none;
      background: #111;
      color: #eee;
      font-size: 13px;
      cursor: pointer;
      transition: 0.12s;
    }
    .gameBtn:hover {
      background: #1e1e1e;
    }
    .gameBtn.active {
      background: #00e5ff;
      color: #000;
      box-shadow: 0 0 10px #00e5ff;
    }
    #main {
      flex: 1;
      position: relative;
      background: #000;
    }
    #gameFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }
    #emptyHint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #777;
      pointer-events: none;
      font-size: 14px;
    }
    #emptyHint h1 {
      margin: 0 0 8px;
      font-size: 22px;
      color: #ccc;
    }
  </style>
</head>
<body>

<div id="sidebar">
  <div id="sidebarHeader">Zyon's Arcade</div>
  <div id="gameList">

    <div class="sectionTitle">Featured</div>
    <button class="gameBtn" data-game="games/design-the-next-phone.html">Design the Next Phone</button>
    <button class="gameBtn" data-game="games/stimulation-clicker.html">Stimulation Clicker</button>
    <button class="gameBtn" data-game="games/baldisbasics/index.html">Baldi's Basics</button>
    <button class="gameBtn" data-game="games/minecraft.html">Minecraft</button>
    <button class="gameBtn" data-game="games/roblox.html">Roblox</button>

    <div class="sectionTitle">Arcade Classics</div>
    <button class="gameBtn" data-game="games/pong.html">Pong</button>
    <button class="gameBtn" data-game="games/breakout.html">Breakout</button>
    <button class="gameBtn" data-game="games/tetris.html">Tetris</button>
    <button class="gameBtn" data-game="games/snake.html">Snake</button>
    <button class="gameBtn" data-game="games/asteroids.html">Asteroids</button>
    <button class="gameBtn" data-game="games/space.html">Space Shooter</button>
    <button class="gameBtn" data-game="games/tower.html">Tower</button>
    <button class="gameBtn" data-game="games/stack.html">Stack</button>

    <div class="sectionTitle">Geometry Dash</div>
    <button class="gameBtn" data-game="games/gdashbreeze.html">GDash Breeze</button>
    <button class="gameBtn" data-game="games/gdashlite.html">GDash Lite</button>
    <button class="gameBtn" data-game="games/gdashsubzero.html">GDash Subzero</button>

    <div class="sectionTitle">Skill & Reflex</div>
    <button class="gameBtn" data-game="games/flappy.html">Flappy</button>
    <button class="gameBtn" data-game="games/jump.html">Jump</button>
    <button class="gameBtn" data-game="games/runner.html">Runner</button>
    <button class="gameBtn" data-game="games/dodge.html">Dodge</button>
    <button class="gameBtn" data-game="games/laser.html">Laser</button>
    <button class="gameBtn" data-game="games/reaction.html">Reaction</button>
    <button class="gameBtn" data-game="games/typing.html">Typing</button>

    <div class="sectionTitle">Puzzles & Logic</div>
    <button class="gameBtn" data-game="games/2048.html">2048</button>
    <button class="gameBtn" data-game="games/maze.html">Maze</button>
    <button class="gameBtn" data-game="games/memory.html">Memory</button>
    <button class="gameBtn" data-game="games/slide.html">Slide</button>
    <button class="gameBtn" data-game="games/portal.html">Portal</button>

    <div class="sectionTitle">Physics & Movement</div>
    <button class="gameBtn" data-game="games/bounce.html">Bounce</button>
    <button class="gameBtn" data-game="games/gravity.html">Gravity</button>
    <button class="gameBtn" data-game="games/helicopter.html">Helicopter</button>
    <button class="gameBtn" data-game="games/fly.html">Fly</button>
    <button class="gameBtn" data-game="games/swim.html">Swim</button>
    <button class="gameBtn" data-game="games/race.html">Race</button>
    <button class="gameBtn" data-game="games/supercross.html">Action Supercross</button>
    <button class="gameBtn" data-game="games/platformer.html">Platformer</button>

    <div class="sectionTitle">Sandbox & Weird</div>
    <button class="gameBtn" data-game="games/argio.html">Argio</button>
    <button class="gameBtn" data-game="games/infinitecraft.html">Infinite Craft</button>
    <button class="gameBtn" data-game="games/idle.html">Idle</button>
    <button class="gameBtn" data-game="games/warp.html">Warp</button>

  </div>
</div>

<div id="main">
  <iframe id="gameFrame" src="about:blank"></iframe>
  <div id="emptyHint">
    <h1>Welcome to Zyon Arcade</h1>
    <div>Select a game on the left to start.</div>
  </div>
</div>

<script type="module">
  import { registerUser, updateGame, checkBanOnLoad } from "./firebase.js";
  import "./devtools.js";

  checkBanOnLoad();
  registerUser();

  const frame = document.getElementById("gameFrame");
  const emptyHint = document.getElementById("emptyHint");
  const buttons = Array.from(document.querySelectorAll(".gameBtn"));

  function setActiveButton(game) {
    buttons.forEach(btn => {
      if (btn.dataset.game === game) btn.classList.add("active");
      else btn.classList.remove("active");
    });
  }

  window.loadGame = function(game) {
    frame.src = game;
    emptyHint.style.display = "none";
    setActiveButton(game);
    updateGame(game);
  };

  buttons.forEach(btn => {
    btn.addEventListener("click", () => {
      const game = btn.dataset.game;
      loadGame(game);
    });
  });

  frame.src = "about:blank";
  emptyHint.style.display = "flex";
  updateGame("none");
</script>

</body>
</html>
