<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gravity Sandbox</title>
<style>
body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; }
canvas { background:#111; border:2px solid #fff; }
</style>
</head>
<body>
<canvas id="game" width="500" height="500"></canvas>
<script>
const c = document.getElementById("game");
const x = c.getContext("2d");

let balls = [];

c.addEventListener("click", e => {
    balls.push({
        x: e.offsetX,
        y: e.offsetY,
        vx: (Math.random()*4)-2,
        vy: (Math.random()*4)-2,
        r: 10
    });
});

function update() {
    balls.forEach(b => {
        b.vy += 0.2;
        b.x += b.vx;
        b.y += b.vy;

        if (b.x < b.r || b.x > 500-b.r) b.vx *= -1;
        if (b.y > 500-b.r) {
            b.y = 500-b.r;
            b.vy *= -0.8;
        }
    });
}

function draw() {
    x.fillStyle = "#111";
    x.fillRect(0,0,500,500);

    x.fillStyle = "#0f0";
    balls.forEach(b => {
        x.beginPath();
        x.arc(b.x,b.y,b.r,0,Math.PI*2);
        x.fill();
    });
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
