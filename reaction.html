<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Reaction Test</title>
<style>
body { margin:0; background:#111; color:#fff; font-family:system-ui; display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; }
#box { width:300px; height:300px; background:#f00; display:flex; justify-content:center; align-items:center; font-size:24px; cursor:pointer; }
</style>
</head>
<body>
<h1 id="msg">Wait for green...</h1>
<div id="box">WAIT</div>

<script>
let ready = false;
let startTime;

setTimeout(()=>{
    document.getElementById("box").style.background="#0f0";
    document.getElementById("box").innerText="CLICK!";
    ready = true;
    startTime = performance.now();
}, Math.random()*3000+1000);

document.getElementById("box").onclick = () => {
    if (!ready) return;
    const rt = performance.now() - startTime;
    document.getElementById("msg").innerText = "Reaction: " + Math.floor(rt) + " ms";
    document.getElementById("box").innerText = "Done";
};
</script>
</body>
</html>
