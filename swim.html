<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Swim Game</title>
<style>
body { margin:0; background:#003; display:flex; justify-content:center; align-items:center; height:100vh; }
canvas { background:#004; border:2px solid #fff; }
</style>
</head>
<body>
<canvas id="game" width="500" height="400"></canvas>
<script>
const c = document.getElementById("game");
const x = c.getContext("2d");

let sy, vy, obstacles, frame, keys, gameOver;

function reset() {
    sy = 200;
    vy = 0;
    obstacles = [];
    frame = 0;
    keys = {};
    gameOver = false;
}
window.addEventListener("keydown", e => keys[e.code] = true);

function update() {
    if (gameOver) return;

    vy += 0.2;
    if (keys["Space"]) vy -= 0.5;

    sy += vy;

    frame++;
    if (frame % 60 === 0) {
        const gap = 120;
        const top = Math.random()*200;
        obstacles.push({x:500,top,bottom:top+gap});
    }

    obstacles.forEach(o => o.x -= 4);
    obstacles = obstacles.filter(o => o.x > -40);

    for (const o of obstacles) {
        if (o.x < 60 && o.x > 20) {
            if (sy < o.top || sy > o.bottom) gameOver = true;
        }
    }

    if (sy < 0 || sy > 400) gameOver = true;
}

function draw() {
    x.fillStyle = "#004";
    x.fillRect(0,0,500,400);

    x.fillStyle = "#0ff";
    x.fillRect(40,sy-10,20,20);

    x.fillStyle = "#0a0";
    obstacles.forEach(o => {
        x.fillRect(o.x,0,40,o.top);
        x.fillRect(o.x,o.bottom,40,400-o.bottom);
    });

    if (gameOver) {
        x.fillStyle = "#fff";
        x.font = "32px system-ui";
        x.fillText("Game Over", 160, 200);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
