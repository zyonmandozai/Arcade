<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clicker</title>
<style>
body { margin:0; background:#111; color:#fff; font-family:system-ui; display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; }
button { padding:10px 20px; font-size:20px; margin:10px; }
</style>
</head>
<body>
<h1 id="score">Score: 0</h1>
<button id="clickBtn">CLICK</button>
<button id="upgradeBtn">Upgrade (Cost: 50)</button>

<script>
let score = 0;
let power = 1;

document.getElementById("clickBtn").onclick = () => {
    score += power;
    update();
};

document.getElementById("upgradeBtn").onclick = () => {
    if (score >= 50) {
        score -= 50;
        power++;
        update();
    }
};

function update() {
    document.getElementById("score").innerText = "Score: " + score;
}
</script>
</body>
</html>
