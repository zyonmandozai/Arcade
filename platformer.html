<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Platformer</title>
<style>
body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; }
canvas { background:#222; border:2px solid #fff; }
</style>
</head>
<body>
<canvas id="game" width="600" height="400"></canvas>
<script>
const c = document.getElementById("game");
const x = c.getContext("2d");

let px, py, vx, vy, keys, platforms;

function reset() {
    px = 50; py = 300;
    vx = 0; vy = 0;
    keys = {};
    platforms = [
        {x:0,y:350,w:600,h:50},
        {x:150,y:280,w:120,h:20},
        {x:320,y:220,w:120,h:20},
        {x:480,y:160,w:100,h:20}
    ];
}
window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

function update() {
    vx = 0;
    if (keys["ArrowLeft"]) vx = -4;
    if (keys["ArrowRight"]) vx = 4;

    vy += 0.5;

    px += vx;
    py += vy;

    let onGround = false;
    for (const p of platforms) {
        if (px+20 > p.x && px < p.x+p.w && py+20 > p.y && py+20 < p.y+vy+20) {
            py = p.y - 20;
            vy = 0;
            onGround = true;
        }
    }

    if (onGround && keys["Space"]) vy = -10;

    if (py > 380) reset();
}

function draw() {
    x.fillStyle = "#222";
    x.fillRect(0,0,600,400);

    x.fillStyle = "#0f0";
    x.fillRect(px,py,20,20);

    x.fillStyle = "#555";
    platforms.forEach(p => x.fillRect(p.x,p.y,p.w,p.h));
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
