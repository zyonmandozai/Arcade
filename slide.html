<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Slide Puzzle</title>
<style>
body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; }
.grid { display:grid; grid-template-columns:repeat(3,100px); gap:5px; }
.tile { width:100px; height:100px; background:#333; color:#fff; display:flex; justify-content:center; align-items:center; font-size:32px; cursor:pointer; }
.empty { background:#000; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>

<script>
let tiles = [1,2,3,4,5,6,7,8,null];
tiles.sort(()=>Math.random()-0.5);

const grid = document.getElementById("grid");

function draw() {
    grid.innerHTML = "";
    tiles.forEach((v,i)=>{
        const div = document.createElement("div");
        div.className = "tile";
        if (v === null) div.classList.add("empty");
        div.innerText = v || "";
        div.onclick = () => move(i);
        grid.appendChild(div);
    });
}

function move(i) {
    const empty = tiles.indexOf(null);
    const valid = [i-1,i+1,i-3,i+3];
    if (valid.includes(empty)) {
        [tiles[i],tiles[empty]] = [tiles[empty],tiles[i]];
        draw();
    }
}

draw();
</script>
</body>
</html>
