<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>2048</title>
    <style>
        body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; color:#fff; font-family:system-ui; }
        canvas { background:#111; border:2px solid #fff; }
    </style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let grid;

function reset() {
    grid = Array.from({length:4},()=>Array(4).fill(0));
    addTile();
    addTile();
}
function addTile() {
    const empty = [];
    for (let y=0;y<4;y++) for (let x=0;x<4;x++) if (!grid[y][x]) empty.push({x,y});
    if (!empty.length) return;
    const {x,y} = empty[Math.floor(Math.random()*empty.length)];
    grid[y][x] = Math.random()<0.9?2:4;
}
window.addEventListener('keydown', e => {
    let moved = false;
    if (e.code === 'ArrowLeft') moved = moveLeft();
    if (e.code === 'ArrowRight') moved = moveRight();
    if (e.code === 'ArrowUp') moved = moveUp();
    if (e.code === 'ArrowDown') moved = moveDown();
    if (moved) addTile();
});

function compress(row) {
    const arr = row.filter(v=>v);
    while (arr.length<4) arr.push(0);
    return arr;
}
function merge(row) {
    for (let i=0;i<3;i++) {
        if (row[i] && row[i]===row[i+1]) {
            row[i]*=2;
            row[i+1]=0;
        }
    }
    return row;
}
function moveLeft() {
    let moved=false;
    for (let y=0;y<4;y++) {
        let row = grid[y];
        const original = row.slice();
        row = compress(row);
        row = merge(row);
        row = compress(row);
        grid[y] = row;
        if (row.toString()!==original.toString()) moved=true;
    }
    return moved;
}
function moveRight() {
    let moved=false;
    for (let y=0;y<4;y++) {
        let row = grid[y].slice().reverse();
        const original = grid[y].slice();
        row = compress(row);
        row = merge(row);
        row = compress(row);
        row.reverse();
        grid[y] = row;
        if (row.toString()!==original.toString()) moved=true;
    }
    return moved;
}
function moveUp() {
    let moved=false;
    for (let x=0;x<4;x++) {
        let col = [grid[0][x],grid[1][x],grid[2][x],grid[3][x]];
        const original = col.slice();
        col = compress(col);
        col = merge(col);
        col = compress(col);
        for (let y=0;y<4;y++) grid[y][x]=col[y];
        if (col.toString()!==original.toString()) moved=true;
    }
    return moved;
}
function moveDown() {
    let moved=false;
    for (let x=0;x<4;x++) {
        let col = [grid[0][x],grid[1][x],grid[2][x],grid[3][x]].reverse();
        const original = [grid[0][x],grid[1][x],grid[2][x],grid[3][x]];
        col = compress(col);
        col = merge(col);
        col = compress(col);
        col.reverse();
        for (let y=0;y<4;y++) grid[y][x]=col[y];
        if (col.toString()!==original.toString()) moved=true;
    }
    return moved;
}

function draw() {
    ctx.fillStyle = '#111';
    ctx.fillRect(0,0,400,400);

    const size = 90;
    for (let y=0;y<4;y++) {
        for (let x=0;x<4;x++) {
            const v = grid[y][x];
            ctx.fillStyle = v ? '#f0a' : '#333';
            ctx.fillRect(10+x*(size+10),10+y*(size+10),size,size);
            if (v) {
                ctx.fillStyle = '#fff';
                ctx.font = '24px system-ui';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(v,10+x*(size+10)+size/2,10+y*(size+10)+size/2);
            }
        }
    }
}

function loop() {
    draw();
    requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
