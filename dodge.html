<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dodge</title>
<style>
body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; }
canvas { background:#111; border:2px solid #fff; }
</style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<script>
const c = document.getElementById("game");
const x = c.getContext("2d");

let px, py, keys, blocks, frame, gameOver;

function reset() {
    px = 200; py = 550;
    keys = {};
    blocks = [];
    frame = 0;
    gameOver = false;
}
window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

function update() {
    if (gameOver) return;

    if (keys["ArrowLeft"]) px -= 5;
    if (keys["ArrowRight"]) px += 5;
    px = Math.max(0, Math.min(380, px));

    frame++;
    if (frame % 20 === 0) {
        blocks.push({x:Math.random()*380,y:-20});
    }

    blocks.forEach(b => b.y += 5);
    blocks = blocks.filter(b => b.y < 620);

    for (const b of blocks) {
        if (Math.abs(px - b.x) < 20 && Math.abs(py - b.y) < 20) {
            gameOver = true;
        }
    }
}

function draw() {
    x.fillStyle = "#000";
    x.fillRect(0,0,400,600);

    x.fillStyle = "#0f0";
    x.fillRect(px,py,20,20);

    x.fillStyle = "#f00";
    blocks.forEach(b => x.fillRect(b.x,b.y,20,20));

    if (gameOver) {
        x.fillStyle = "#fff";
        x.font = "32px system-ui";
        x.fillText("Game Over", 120, 300);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
