<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Helicopter</title>
<style>
body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; }
canvas { background:#111; border:2px solid #fff; }
</style>
</head>
<body>
<canvas id="game" width="500" height="400"></canvas>
<script>
const c = document.getElementById("game");
const x = c.getContext("2d");

let hy, vy, walls, frame, keys, gameOver;

function reset() {
    hy = 200;
    vy = 0;
    walls = [];
    frame = 0;
    keys = {};
    gameOver = false;
}
window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

function update() {
    if (gameOver) return;

    vy += 0.3;
    if (keys["Space"]) vy -= 0.6;

    hy += vy;

    frame++;
    if (frame % 50 === 0) {
        const gap = 120;
        const top = Math.random()*200;
        walls.push({x:500, top, bottom:top+gap});
    }

    walls.forEach(w => w.x -= 3);
    walls = walls.filter(w => w.x > -40);

    for (const w of walls) {
        if (w.x < 60 && w.x > 20) {
            if (hy < w.top || hy > w.bottom) gameOver = true;
        }
    }

    if (hy < 0 || hy > 400) gameOver = true;
}

function draw() {
    x.fillStyle = "#111";
    x.fillRect(0,0,500,400);

    x.fillStyle = "#0f0";
    x.fillRect(40,hy-10,20,20);

    x.fillStyle = "#f00";
    walls.forEach(w => {
        x.fillRect(w.x,0,40,w.top);
        x.fillRect(w.x,w.bottom,40,400-w.bottom);
    });

    if (gameOver) {
        x.fillStyle = "#fff";
        x.font = "32px system-ui";
        x.fillText("Game Over", 160, 200);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
