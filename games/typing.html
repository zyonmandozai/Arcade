<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Typing Test</title>
<style>
body { margin:0; background:#111; color:#fff; font-family:system-ui; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; }
#word { font-size:40px; margin-bottom:20px; }
input { padding:10px; font-size:20px; width:300px; text-align:center; }
</style>
</head>
<body>
<div id="word"></div>
<input id="input" autocomplete="off" />

<script>
const words = ["sky","jump","code","pixel","speed","ghost","laser","drive","warp","portal","stack","gravity","blast","orbit","neon"];
let current, score = 0;

function newWord() {
    current = words[Math.floor(Math.random()*words.length)];
    document.getElementById("word").innerText = current;
    document.getElementById("input").value = "";
}
document.getElementById("input").addEventListener("input", e => {
    if (e.target.value === current) {
        score++;
        newWord();
    }
});
newWord();
</script>
</body>
</html>
