<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pong Clone</title>
    <style>
        body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; }
        canvas { background:#111; border:2px solid #fff; }
    </style>
</head>
<body>
<canvas id="game" width="400" height="600"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let ball, p1, p2, keys;

function reset() {
    ball = {x:200,y:300,vx:4,vy:4};
    p1 = 250;
    p2 = 250;
    keys = {};
}
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

function update() {
    if (keys['ArrowUp']) p1 -= 6;
    if (keys['ArrowDown']) p1 += 6;
    p1 = Math.max(0, Math.min(520, p1));

    p2 = ball.y - 40;

    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.y < 0 || ball.y > 600) ball.vy *= -1;

    if (ball.x < 40 && ball.y > p1 && ball.y < p1+80) ball.vx *= -1;
    if (ball.x > 360 && ball.y > p2 && ball.y < p2+80) ball.vx *= -1;

    if (ball.x < -20 || ball.x > 420) reset();
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,400,600);

    ctx.fillStyle = '#fff';
    ctx.fillRect(20,p1,10,80);
    ctx.fillRect(370,p2,10,80);

    ctx.beginPath();
    ctx.arc(ball.x,ball.y,10,0,Math.PI*2);
    ctx.fill();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
