<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jump Game</title>
<style>
body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; }
canvas { background:#222; border:2px solid #fff; }
</style>
</head>
<body>
<canvas id="game" width="500" height="300"></canvas>
<script>
const c = document.getElementById("game");
const x = c.getContext("2d");

let px, py, vy, gravity, spikes, frame, keys, gameOver;

function reset() {
    px = 50;
    py = 250;
    vy = 0;
    gravity = 0.5;
    spikes = [];
    frame = 0;
    keys = {};
    gameOver = false;
}
window.addEventListener("keydown", e => keys[e.code] = true);

function update() {
    if (gameOver) return;

    if (keys["Space"] && py >= 250) vy = -10;

    vy += gravity;
    py += vy;
    if (py > 250) py = 250;

    frame++;
    if (frame % 80 === 0) spikes.push({x:500});

    spikes.forEach(s => s.x -= 5);
    spikes = spikes.filter(s => s.x > -20);

    for (const s of spikes) {
        if (px+20 > s.x && px < s.x+20 && py+20 > 230) gameOver = true;
    }
}

function draw() {
    x.fillStyle = "#222";
    x.fillRect(0,0,500,300);

    x.fillStyle = "#0f0";
    x.fillRect(px,py,20,20);

    x.fillStyle = "#f00";
    spikes.forEach(s => x.fillRect(s.x,230,20,20));

    if (gameOver) {
        x.fillStyle = "#fff";
        x.font = "32px system-ui";
        x.fillText("Game Over", 160, 150);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
