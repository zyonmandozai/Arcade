<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Laser Dodge</title>
<style>
body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; }
canvas { background:#111; border:2px solid #fff; }
</style>
</head>
<body>
<canvas id="game" width="500" height="500"></canvas>
<script>
const c = document.getElementById("game");
const x = c.getContext("2d");

let px = 250, py = 250, keys = {};
let angle = 0;

window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

function update() {
    if (keys["ArrowUp"]) py -= 4;
    if (keys["ArrowDown"]) py += 4;
    if (keys["ArrowLeft"]) px -= 4;
    if (keys["ArrowRight"]) px += 4;

    px = Math.max(10, Math.min(490, px));
    py = Math.max(10, Math.min(490, py));

    angle += 0.03;

    const lx = 250 + Math.cos(angle)*200;
    const ly = 250 + Math.sin(angle)*200;

    if (Math.abs(px - lx) < 15 && Math.abs(py - ly) < 15) {
        px = 250; py = 250;
    }
}

function draw() {
    x.fillStyle = "#111";
    x.fillRect(0,0,500,500);

    x.strokeStyle = "#f00";
    x.lineWidth = 4;
    x.beginPath();
    x.moveTo(250,250);
    x.lineTo(250 + Math.cos(angle)*200, 250 + Math.sin(angle)*200);
    x.stroke();

    x.fillStyle = "#0f0";
    x.fillRect(px-10,py-10,20,20);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
