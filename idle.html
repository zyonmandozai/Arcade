<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Idle Game</title>
<style>
body { margin:0; background:#111; color:#fff; font-family:system-ui; display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; }
button { padding:10px 20px; margin:10px; }
</style>
</head>
<body>
<h1 id="score">Score: 0</h1>
<button id="buy">Buy Generator (Cost: 100)</button>

<script>
let score = 0;
let generators = 0;

document.getElementById("buy").onclick = () => {
    if (score >= 100) {
        score -= 100;
        generators++;
        update();
    }
};

function update() {
    document.getElementById("score").innerText = "Score: " + score;
}

setInterval(() => {
    score += generators;
    update();
}, 1000);
</script>
</body>
</html>
