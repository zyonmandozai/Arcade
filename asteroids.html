<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Asteroids</title>
<style>
body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; }
canvas { background:#000; border:2px solid #fff; }
</style>
</head>
<body>
<canvas id="game" width="600" height="600"></canvas>
<script>
const c = document.getElementById("game");
const x = c.getContext("2d");

let ship, bullets, rocks, keys;

function reset() {
    ship = {x:300,y:300,angle:0,vx:0,vy:0};
    bullets = [];
    rocks = [];
    keys = {};

    for (let i=0;i<5;i++) {
        rocks.push({
            x:Math.random()*600,
            y:Math.random()*600,
            vx:(Math.random()*2)-1,
            vy:(Math.random()*2)-1,
            r:30
        });
    }
}
window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

function update() {
    if (keys["ArrowLeft"]) ship.angle -= 0.08;
    if (keys["ArrowRight"]) ship.angle += 0.08;
    if (keys["ArrowUp"]) {
        ship.vx += Math.cos(ship.angle)*0.2;
        ship.vy += Math.sin(ship.angle)*0.2;
    }

    ship.x += ship.vx;
    ship.y += ship.vy;

    if (ship.x<0) ship.x=600;
    if (ship.x>600) ship.x=0;
    if (ship.y<0) ship.y=600;
    if (ship.y>600) ship.y=0;

    if (keys["Space"]) {
        bullets.push({
            x:ship.x,
            y:ship.y,
            vx:Math.cos(ship.angle)*6,
            vy:Math.sin(ship.angle)*6
        });
        keys["Space"] = false;
    }

    bullets.forEach(b => {
        b.x += b.vx;
        b.y += b.vy;
    });
    bullets = bullets.filter(b => b.x>=0 && b.x<=600 && b.y>=0 && b.y<=600);

    rocks.forEach(r => {
        r.x += r.vx;
        r.y += r.vy;
        if (r.x<0) r.x=600;
        if (r.x>600) r.x=0;
        if (r.y<0) r.y=600;
        if (r.y>600) r.y=0;
    });

    for (const b of bullets) {
        for (const r of rocks) {
            if (Math.hypot(b.x-r.x,b.y-r.y) < r.r) {
                r.dead = true;
                b.dead = true;
            }
        }
    }
    bullets = bullets.filter(b => !b.dead);
    rocks = rocks.filter(r => !r.dead);
}

function draw() {
    x.fillStyle = "#000";
    x.fillRect(0,0,600,600);

    x.strokeStyle = "#fff";
    x.beginPath();
    x.moveTo(ship.x + Math.cos(ship.angle)*15, ship.y + Math.sin(ship.angle)*15);
    x.lineTo(ship.x + Math.cos(ship.angle+2.5)*15, ship.y + Math.sin(ship.angle+2.5)*15);
    x.lineTo(ship.x + Math.cos(ship.angle-2.5)*15, ship.y + Math.sin(ship.angle-2.5)*15);
    x.closePath();
    x.stroke();

    x.fillStyle = "#0f0";
    bullets.forEach(b => x.fillRect(b.x-2,b.y-2,4,4));

    x.strokeStyle = "#f00";
    rocks.forEach(r => {
        x.beginPath();
        x.arc(r.x,r.y,r.r,0,Math.PI*2);
        x.stroke();
    });
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
reset();
loop();
</script>
</body>
</html>
